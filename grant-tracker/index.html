<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Tree Locale</title>
  <meta name="description" content="One Tree Locale — community and environment, North West NSW.">
  <meta name="theme-color" content="#3b2a5e">
  <link rel="icon" type="image/png" href="ledger/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="ledger/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2dee9;
      --ink: #3b2a5e;
      --soft: #79447f;
      --rule: #d00670;
      --rule2: #d0ddb9;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #241a3a; --ink: #f2dee9; --soft: #d0ddb9; }
      .logo { border-radius: 50%; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { max-width: 34rem; }
    .logo { width: min(260px, 70vw); height: auto; display: block; margin: 0 auto 1.5rem; }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 600;
      font-size: clamp(2rem, 7vw, 3rem);
      letter-spacing: -0.01em;
    }
    .stripe {
      width: 7rem; height: 4px; margin: 1rem auto 1.25rem; border-radius: 2px;
      background: linear-gradient(90deg, var(--rule), var(--rule2), var(--rule));
    }
    p { color: var(--soft); font-size: 1.05rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="ledger/icons/icon-512.png" alt="A lone tree on a grassy hill under a purple night sky">
    <h1>One Tree Locale</h1>
    <div class="stripe" aria-hidden="true"></div>
    <p>Community and environment, North West NSW.</p>
  </main>
</body>
</html>
