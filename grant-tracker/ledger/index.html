<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3b2a5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OTL Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>if(/\/ledger$/.test(location.pathname))location.replace(location.pathname+'/'+location.search);</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<title>One Tree Locale Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#3b2a5e;--grape:#543772;--violet:#79447f;--sage:#5d7c41;--sage-dk:#3d5429;--green:#9cb86c;
  --pale-sage:#d0ddb9;--pale-pink:#f2dee9;--pink:#c779a1;--fuchsia:#d00670;--fuchsia-dk:#96044f;--sky:#6569a0;--grey:#494258;
  --bg:var(--pale-pink);--card:#fff;--ink:var(--grey);--muted:var(--violet);--line:var(--pale-sage);
  --head:var(--purple);--accent:var(--sage);--accent-ink:var(--sage-dk);--accent-soft:#e8efdc;
  --warn:var(--fuchsia);--warn-ink:var(--fuchsia-dk);--warn-soft:#fbe3ef;--credit-soft:var(--pale-pink);--credit-ink:var(--grape);
  --btn:var(--purple);--btn-hover:var(--sage);--field:#fbf6f9;
  --shadow:0 1px 3px rgba(59,42,94,.08),0 4px 14px rgba(59,42,94,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1e1927;--card:#2a2336;--ink:#f2dee9;--muted:#c79fc6;--line:#3f3552;
  --head:#e7d3f0;--accent:#9cb86c;--accent-ink:#b9d18f;--accent-soft:#2c3a22;
  --warn:#ef5aa3;--warn-ink:#f58cbf;--warn-soft:#45192f;--credit-soft:#3a2b48;--credit-ink:#e0bfe0;
  --btn:#79447f;--btn-hover:#5d7c41;--field:#231d2e;--shadow:none;color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Inter',-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,.stat .val{font-family:'Playfair Display',Georgia,serif}
.banner{background:linear-gradient(135deg,var(--purple) 0%,var(--sage) 100%);color:#fff;position:relative}
.banner::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--fuchsia),var(--pale-sage),var(--fuchsia))}
.banner-in{max-width:980px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 24px calc(16px + env(safe-area-inset-left))}
h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-.02em}
.banner p{margin:2px 0 0;color:var(--pale-sage);font-size:14px}
.navbar{background:var(--card);border-bottom:2px solid var(--line)}
nav{max-width:980px;margin:auto;display:flex;gap:2px;overflow-x:auto;padding:0 10px}
nav button{flex:none;font:inherit;font-size:14px;font-weight:500;padding:13px 12px 11px;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;color:var(--muted);cursor:pointer}
nav button:hover{color:var(--head)}
nav button.on{color:var(--head);border-bottom-color:var(--fuchsia);font-weight:600}
main{max-width:980px;margin:auto;padding:18px calc(16px + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
h2{font-size:18px;font-weight:600;margin:0 0 12px;color:var(--head)}
h2 .muted{font-family:'Inter',sans-serif;font-size:14px;font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .val{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--head)}
.stat .sub{font-size:12px;color:var(--muted)}
.stat.good .val{color:var(--accent-ink)} .stat.bad .val{color:var(--warn)}
.muted{color:var(--muted)}
form.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{font-size:12px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;font-size:15px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);width:100%}
input[type=date]{cursor:pointer;min-height:42px}
input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.85;padding:2px}
input:focus,select:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(121,68,127,.15)}
.btn{font:inherit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:8px;border:none;background:var(--btn);color:#fff;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--btn-hover)}
.btn.ghost{background:var(--card);color:var(--grape);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--bg);border-color:var(--sage)}
.btn.danger{background:var(--fuchsia)} .btn.danger:hover{background:var(--fuchsia-dk)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-bottom:none;color:var(--head)}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.pill.warn{background:var(--credit-soft);color:var(--credit-ink)}
.pill.bad{background:var(--warn-soft);color:var(--warn-ink)}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.x:hover{color:var(--warn)}
.acts{white-space:nowrap}
.acts .x[data-act=edit]:hover{color:var(--accent)}
.link{background:none;border:none;padding:0;font:inherit;color:var(--grape);font-weight:500;cursor:pointer;text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:3px}
@media (prefers-color-scheme:dark){.link{color:var(--credit-ink)}.btn.ghost{color:var(--credit-ink)}}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--green))}
.periods{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.periods button{font:inherit;font-size:13px;font-weight:500;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--grape);cursor:pointer}
@media (prefers-color-scheme:dark){.periods button{color:var(--ink)}}
.periods button.on{background:var(--btn);border-color:var(--btn);color:#fff}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--purple);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
*{-webkit-tap-highlight-color:transparent}
@media (max-width:600px){
  .grid{grid-template-columns:1fr 1fr}
  .grid .stat:last-child:nth-child(odd){grid-column:1/-1}
  .tablewrap table,.tablewrap tbody,.tablewrap tfoot,.tablewrap tr,.tablewrap td{display:block;width:100%}
  .tablewrap thead{display:none}
  .tablewrap tbody tr{position:relative;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:8px;background:var(--card)}
  .tablewrap td{display:flex;justify-content:space-between;gap:12px;align-items:center;border:none;padding:4px 0;white-space:normal;text-align:right}
  .tablewrap td::before{content:attr(data-label);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;flex:none}
  .tablewrap td.blank,.tablewrap td[data-label=""]:not(:has(.x)){display:none}
  .tablewrap td:has(.x){position:absolute;top:2px;right:4px;width:auto;padding:0}
  .tablewrap td:has(.x)::before{content:none}
  .tablewrap tbody td:first-child{padding-right:28px}
  .tablewrap tbody tr:has(.acts .x+.x) td:first-child{padding-right:64px}
  .acts .x{padding:4px 8px}
  .tablewrap tfoot tr{display:flex;justify-content:space-between;padding:6px 10px}
  .tablewrap tfoot td{display:inline;width:auto;padding:0}
  .tablewrap tfoot td::before{content:none}
  .tablewrap tfoot td.blank{display:none}
  .tablewrap .bar{flex:1;max-width:160px}
}

.bad-field{border-color:var(--fuchsia)!important;box-shadow:0 0 0 3px rgba(208,6,112,.15)!important}
.modal{position:fixed;inset:0;background:rgba(73,66,88,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal-box{background:var(--card);color:var(--ink);border-radius:12px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal-box p{margin:0 0 16px}
.modal-box .actions{justify-content:flex-end}
.storage-warn{background:var(--warn-soft);border-color:var(--pink);color:var(--warn-ink)}
#toast{z-index:10;bottom:calc(20px + env(safe-area-inset-bottom));max-width:calc(100% - 32px);text-align:center}
#toast{z-index:40}
textarea{font:inherit;font-size:15px;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);width:100%;resize:vertical}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-head h2{margin:0}
.btn.sm{padding:7px 12px;font-size:13px}
.modal-box.wide{max-width:520px;max-height:calc(100vh - 32px);overflow:auto}

/* Statement of account: always printed-paper colours, whatever the phone's theme */
.modal.stmt-wrap{display:block;overflow:auto;background:#e9e3ec;padding:0;z-index:30;color-scheme:light}
.stmt-bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--purple);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.stmt-bar .btn{background:#fff;color:var(--purple)} .stmt-bar .btn:hover{background:var(--pale-sage)}
.stmt-bar .btn.close{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5);margin-left:auto}
.stmt-pages{padding:16px 12px calc(40px + env(safe-area-inset-bottom))}
.stmt{background:#fff;color:#494258;max-width:780px;margin:0 auto 18px;border-radius:6px;box-shadow:0 2px 14px rgba(59,42,94,.18);font-size:13.5px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.stmt-top{background:linear-gradient(135deg,#3b2a5e 0%,#5d7c41 100%);color:#fff;padding:20px 24px 18px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;border-bottom:4px solid #d00670}
.stmt-top img{width:58px;height:58px;border-radius:12px;background:#f2dee9;flex:none}
.stmt-biz{display:flex;gap:14px;align-items:center}
.stmt-biz b{font:700 22px 'Playfair Display',Georgia,serif;display:block;line-height:1.15}
.stmt-biz small{color:#d0ddb9;font-size:12px;line-height:1.45;display:block}
.stmt-title{text-align:right}
.stmt-title b{font:700 19px 'Playfair Display',Georgia,serif;display:block;letter-spacing:.01em}
.stmt-title span{font-size:12px;color:#d0ddb9}
.stmt-body{padding:20px 24px 22px}
.stmt-meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.stmt-meta .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#79447f;font-weight:600}
.stmt-meta .to{font-weight:600;font-size:15px;color:#3b2a5e}
.stmt-alert{background:#fbe3ef;border-left:4px solid #d00670;color:#96044f;padding:10px 14px;border-radius:4px;margin-bottom:16px;font-weight:500}
.stmt-alert.ok{background:#e8efdc;border-left-color:#5d7c41;color:#3d5429}
.stmt-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stmt-sum div{border:1px solid #d0ddb9;border-radius:8px;padding:9px 12px}
.stmt-sum span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#79447f;font-weight:600;display:block}
.stmt-sum b{font:700 20px 'Playfair Display',Georgia,serif;color:#3b2a5e;font-variant-numeric:tabular-nums}
.stmt-sum .hot{border-color:#d00670;background:#fff5fa} .stmt-sum .hot b{color:#96044f}
.stmt h3{font:600 14px 'Playfair Display',Georgia,serif;color:#3b2a5e;margin:18px 0 6px}
.stmt table{width:100%;border-collapse:collapse;font-size:12.5px}
.stmt th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#79447f;font-weight:600;text-align:left;padding:6px 6px;border-bottom:1.5px solid #3b2a5e}
.stmt td{padding:6px 6px;border-bottom:1px solid #ece6ef;vertical-align:top}
.stmt .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.stmt tfoot td{font-weight:700;color:#3b2a5e;border-bottom:none;border-top:1.5px solid #3b2a5e}
.stmt .late{color:#96044f;font-weight:600} .stmt .soon{color:#3d5429}
.stmt-aging td,.stmt-aging th{text-align:right} .stmt-aging .hot{color:#96044f;font-weight:700}
.stmt-pay{background:#f7f3f9;border-radius:8px;padding:10px 14px;white-space:pre-wrap;margin-top:4px}
.stmt-foot{margin-top:18px;font-size:12px;color:#79447f}
@media (max-width:600px){
  .stmt-top,.stmt-body{padding-left:14px;padding-right:14px}
  .stmt-title{text-align:left}
  .stmt-sum{grid-template-columns:1fr 1fr 1fr;gap:6px} .stmt-sum b{font-size:15px} .stmt-sum div{padding:7px 8px}
  .stmt table{font-size:11.5px} .stmt th,.stmt td{padding:5px 3px}
  .stmt .hide-sm{display:none}
}
@media print{
  @page{margin:12mm}
  body{background:#fff!important}
  body>*:not(#stmt){display:none!important}
  .modal.stmt-wrap{position:static;overflow:visible;background:#fff;padding:0}
  .stmt-bar{display:none!important}
  .stmt-pages{padding:0}
  .stmt{box-shadow:none;border-radius:0;margin:0;max-width:none;break-after:page;page-break-after:always}
  .stmt:last-child{break-after:auto;page-break-after:auto}
  .stmt .hide-sm{display:table-cell!important}
}
</style>
</head>
<body>
<header>
  <div class="banner"><div class="banner-in">
    <h1>One Tree Locale</h1>
    <p>Sales, purchases, customer credit &amp; loans</p>
  </div></div>
  <div class="navbar"><nav>
    <button data-tab="dash">Dashboard</button>
    <button data-tab="sales">Sales</button>
    <button data-tab="purchases">Purchases</button>
    <button data-tab="contacts">Contacts</button>
    <button data-tab="customers">Customer credit</button>
    <button data-tab="loans">Business loans</button>
    <button data-tab="backup">Backup</button>
  </nav></div>
</header>
<main></main>
<div id="toast"></div>
<script>
const KEY='shop-ledger-v1';
const blank=()=>({sales:[],purchases:[],customers:[],custPayments:[],loans:[],loanPayments:[],loanDraws:[],settings:{}});
/* (Runs before the helpers below are defined, so it uses no uid()/today().)
   Loans are one running account per lender: money borrowed (loanDraws) adds to it, repayments come off it.
   Older data kept the amount borrowed on each loan and could have several loans per lender; fold those in. */
function tidyLoans(d){
  d.loanDraws=d.loanDraws||[];
  for(const l of d.loans){
    if(+l.principal>0){
      const first=d.loanPayments.filter(p=>p.loanId===l.id).map(p=>p.date).sort()[0];
      d.loanDraws.push({id:'d'+l.id,date:l.start||first||new Date().toISOString().slice(0,10),loanId:l.id,amount:+l.principal,note:'Opening amount'});
    }
    l.principal=0;
  }
  const keep={};
  d.loans=d.loans.filter(l=>{const k=String(l.lender||'').trim().toLowerCase();const k0=keep[k];
    if(!k0){keep[k]=l;return true;}
    d.loanDraws.forEach(x=>{if(x.loanId===l.id)x.loanId=k0.id;});d.loanPayments.forEach(x=>{if(x.loanId===l.id)x.loanId=k0.id;});
    if(!+k0.repay&&+l.repay){k0.repay=l.repay;k0.freq=l.freq;}
    if(l.start&&(!k0.start||l.start<k0.start))k0.start=l.start;
    return false;});
  return d;
}
let storageOK=true;
let S=load(), tab='dash', period='month', openCust=null, contactSearch='';

function load(){try{localStorage.setItem(KEY+'-test','1');localStorage.removeItem(KEY+'-test');const r=localStorage.getItem(KEY);if(r)return tidyLoans(Object.assign(blank(),JSON.parse(r)));}catch(e){storageOK=false;}return blank();}
function save(){if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;toast('Could not save. Export a backup now.');}}

const $=s=>document.querySelector(s);
function ask(m,okLabel='Yes, go ahead'){return new Promise(res=>{
  const o=document.createElement('div');o.className='modal';
  o.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true"><p></p><div class="actions"><button type="button" class="btn ghost" data-a="0">Cancel</button><button type="button" class="btn" data-a="1"></button></div></div>`;
  o.querySelector('p').textContent=m;o.querySelector('[data-a="1"]').textContent=okLabel;
  const done=v=>{o.remove();document.removeEventListener('keydown',key,true);res(v);};
  const key=e=>{if(e.key==='Escape'){e.stopPropagation();done(false);}};
  o.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)done(b.dataset.a==='1');else if(e.target===o)done(false);});
  document.addEventListener('keydown',key,true);document.body.appendChild(o);o.querySelector('[data-a="1"]').focus();
});}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<-0.004?'-':'')+'$'+Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const sum=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);};
const fmtDate=d=>d?d.split('-').reverse().join('/'):'';
const byDateDesc=(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.id>a.id?1:-1);
const custName=id=>{if(!id)return 'Walk-in';const c=S.customers.find(c=>c.id===id);return c?c.name:'(deleted contact)';};
const supplierName=x=>{if(x.supplierId){const c=S.customers.find(c=>c.id===x.supplierId);if(c)return c.name;}return x.supplier||'';};
const custBal=id=>sum(S.sales.filter(x=>x.customerId===id&&x.pay==='credit'),'amount')-sum(S.custPayments.filter(x=>x.customerId===id),'amount');
const loanPaid=l=>S.loanPayments.filter(p=>p.loanId===l.id);
const loanDrawn=l=>S.loanDraws.filter(x=>x.loanId===l.id);
const loanBorrowed=l=>(+l.principal||0)+sum(loanDrawn(l),'amount');
const loanBal=l=>loanBorrowed(l)-sum(loanPaid(l),'amount');

/* ---------- Overdue accounts & statements ---------- */
const sett=()=>(S.settings&&typeof S.settings==='object')?S.settings:(S.settings={});
const isNum=v=>v!==''&&v!=null&&isFinite(+v);
const defaultTerms=()=>isNum(sett().terms)?+sett().terms:30;
const termsFor=c=>c&&isNum(c.terms)?+c.terms:defaultTerms();
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10);};
const daysFrom=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);
const r2=n=>Math.round(n*100)/100;
/* Repayments pay off the oldest credit sales first. Each unpaid sale is due `terms` days after the sale. */
function aging(id,asOf=today()){
  const c=S.customers.find(c=>c.id===id),terms=termsFor(c);
  const sales=S.sales.filter(x=>x.customerId===id&&x.pay==='credit').sort((a,b)=>a.date.localeCompare(b.date)||(a.id>b.id?1:-1));
  let left=sum(S.custPayments.filter(x=>x.customerId===id),'amount');
  const items=[];
  for(const s of sales){const used=Math.min(left,+s.amount);left=r2(left-used);const owing=r2(s.amount-used);
    if(owing>0.004){const due=addDays(s.date,terms);items.push({...s,owing,due,over:daysFrom(due,asOf)});}}
  const buckets=[0,0,0,0,0]; // not yet due, 1–30, 31–60, 61–90, 90+ days overdue
  items.forEach(i=>{buckets[i.over<=0?0:i.over<=30?1:i.over<=60?2:i.over<=90?3:4]+=i.owing;});
  const overdue=r2(buckets[1]+buckets[2]+buckets[3]+buckets[4]);
  return{terms,items,buckets:buckets.map(r2),overdue,credit:left>0.004?left:0,balance:r2(custBal(id)),
    oldest:items.reduce((m,i)=>Math.max(m,i.over),0)};
}
const overdueAccounts=()=>S.customers.map(c=>({c,a:aging(c.id)})).filter(x=>x.a.overdue>0.004).sort((x,y)=>y.a.overdue-x.a.overdue);
const daysTxt=n=>`${n} day${n===1?'':'s'}`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}

function periodRange(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  const p=n=>String(n).padStart(2,'0');
  if(period==='month')return[`${y}-${p(m+1)}-01`,`${y}-${p(m+1)}-31`];
  if(period==='last'){const ly=m?y:y-1,lm=m?m:12;return[`${ly}-${p(lm)}-01`,`${ly}-${p(lm)}-31`];}
  if(period==='fy'){const s=m>=6?y:y-1;return[`${s}-07-01`,`${s+1}-06-30`];}
  return['0000-00-00','9999-12-31'];
}

function table(heads,rows,numCols=[],foot){
  const cell=(v,i,tag='td')=>`<${tag} class="${numCols.includes(i)?'num':''}${(v===''||v==null)?' blank':''}"${tag==='td'?` data-label="${String(heads[i]||'').replace(/"/g,'')}"`:''}>${v??''}</${tag}>`;
  return `<div class="tablewrap"><table><thead><tr>${heads.map((h,i)=>cell(h,i,'th')).join('')}</tr></thead>
  <tbody>${rows.map(r=>`<tr>${r.map((v,i)=>cell(v,i)).join('')}</tr>`).join('')}</tbody>
  ${foot?`<tfoot><tr>${foot.map((v,i)=>cell(v,i)).join('')}</tr></tfoot>`:''}</table></div>`;
}

const del=(coll,id)=>`<span class="acts">${EDITABLE.includes(coll)?`<button class="x" title="Edit" aria-label="Edit" data-act="edit" data-coll="${coll}" data-id="${id}">✎</button>`:''}<button class="x" title="Delete" aria-label="Delete" data-act="del" data-coll="${coll}" data-id="${id}">×</button></span>`;

function vDash(){
  const [a,b]=periodRange(),inP=x=>x.date>=a&&x.date<=b;
  const sales=S.sales.filter(inP),sTot=sum(sales,'amount'),sCredit=sum(sales.filter(x=>x.pay==='credit'),'amount');
  const pur=sum(S.purchases.filter(inP),'amount');
  const lpTot=sum(S.loanPayments.filter(inP),'amount');
  const custIn=sum(S.custPayments.filter(inP),'amount');
  const income=(sTot-sCredit)+custIn;
  const profit=income-pur,margin=income?Math.round(profit/income*100):0;
  const cashIn=income,cashOut=pur+lpTot;
  const owed=S.customers.reduce((t,c)=>t+Math.max(0,custBal(c.id)),0);
  const debt=S.loans.reduce((t,l)=>t+Math.max(0,loanBal(l)),0);
  const debtors=S.customers.map(c=>({...c,bal:custBal(c.id)})).filter(c=>c.bal>0.004).sort((x,y)=>y.bal-x.bal);
  const over=debtors.filter(c=>+c.limit>0&&c.bal>+c.limit);
  const od=overdueAccounts();
  const P=[['month','This month'],['last','Last month'],['fy','This financial year'],['all','All time']];
  return `<div class="periods">${P.map(([k,l])=>`<button data-act="period" data-p="${k}" class="${period===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="grid">
    ${stat('Income received',money(income),'Paid sales + credit repayments')}
    ${stat('Purchases',money(pur))}
    ${stat('Profit',money(profit),income?`${margin}% margin`:'',profit>=0?'good':'bad')}
  </div>
  <div class="grid">
    ${stat('Sales put on credit',money(sCredit),'Counted when the customer pays')}
    ${stat('Loan repayments',money(lpTot))}
    ${stat('Net cash',money(cashIn-cashOut),'Income − purchases − loan repayments',cashIn-cashOut>=0?'good':'bad')}
  </div>
  <div class="grid">
    ${stat('Customers owe you',money(owed),`${debtors.length} account${debtors.length===1?'':'s'} with a balance`)}
    ${stat('Overdue',money(od.reduce((t,x)=>t+x.a.overdue,0)),od.length?`${od.length} account${od.length===1?'':'s'} past due`:'Nothing past due',od.length?'bad':'good')}
    ${stat('Loan balance left',money(debt),`${S.loans.length} loan${S.loans.length===1?'':'s'}`)}
  </div>
  ${od.length?`<div class="card"><div class="card-head"><h2>Overdue accounts</h2><button class="btn sm" data-act="stmtall">Create statements (${od.length})</button></div>${overdueTable(od.slice(0,8))}</div>`:''}
  ${over.length?`<div class="card"><h2>Over credit limit</h2>${table(['Customer','Limit','Owes'],over.map(c=>[`<button class="link" data-act="cust" data-id="${c.id}">${esc(c.name)}</button>`,money(+c.limit),`<span class="pill bad">${money(c.bal)}</span>`]),[1,2])}</div>`:''}
  <div class="card"><h2>Who owes the most</h2>${debtors.length?table(['Customer','Owes','Limit'],debtors.slice(0,8).map(c=>[`<button class="link" data-act="cust" data-id="${c.id}">${esc(c.name)}</button>`,money(c.bal),+c.limit?money(+c.limit):'—']),[1,2]):empty('No one owes you anything right now.')}</div>

}

const amt=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?Math.round(n*100)/100:0;};
const handlers={
  async sale(d){
    const amount=amt(d.amount);if(amount<=0)return toast('Enter an amount');
    if(d.pay==='credit'&&(!d.customerId||d.customerId==='__new'))return toast('Choose a customer for a credit sale');
    if(d.pay==='credit'){const c=S.customers.find(c=>c.id===d.customerId),lim=+c.limit||0,nb=custBal(c.id)+amount;
      if(lim&&nb>lim&&!await ask(`This takes ${c.name} to ${money(nb)}, over their ${money(lim)} limit. Add it anyway?`))return;}
    S.sales.push({id:uid(),date:d.date,customerId:d.customerId==='__new'?'':(d.customerId||''),desc:d.desc.trim(),amount,pay:d.pay});return 'Sale added';
  },
  purchase(d){const amount=amt(d.amount);if(amount<=0)return toast('Enter an amount');
    S.purchases.push({id:uid(),date:d.date,supplierId:d.supplierId==='__new'?'':(d.supplierId||''),desc:d.desc.trim(),cat:d.cat,amount});return 'Purchase added';},
  async customer(d){const name=d.name.trim();if(!name)return;
    if(S.customers.some(c=>c.name.toLowerCase()===name.toLowerCase())&&!await ask(`You already have a contact called ${name}. Add another one?`))return;
    S.customers.push({id:uid(),name,phone:d.phone.trim(),email:(d.email||'').trim(),notes:(d.notes||'').trim(),limit:amt(d.limit)});return 'Contact added';},
  custedit(d){const c=S.customers.find(c=>c.id===d.id);const t=String(d.terms||'').replace(/[^0-9]/g,'');
    Object.assign(c,{name:d.name.trim(),phone:d.phone.trim(),email:(d.email||'').trim(),notes:(d.notes||'').trim(),limit:amt(d.limit),terms:t===''?'':+t});return 'Saved';},
  async custpay(d){const amount=amt(d.amount);if(!d.customerId||d.customerId==='__new')return toast('Choose a customer');if(amount<=0)return toast('Enter an amount');
    const bal=custBal(d.customerId);
    if(amount>bal+0.004&&!await ask(`${custName(d.customerId)} only owes ${money(bal)}. Record ${money(amount)} anyway (leaves them in credit)?`))return;
    S.custPayments.push({id:uid(),date:d.date,customerId:d.customerId,amount,note:d.note.trim()});return 'Repayment recorded';},
  loan(d){const amount=amt(d.amount),name=d.lender.trim();if(!name)return toast('Enter the lender');if(amount<=0)return toast('Enter the amount borrowed');
    let l=S.loans.find(l=>l.lender.trim().toLowerCase()===name.toLowerCase());const isNew=!l;
    if(!l){l={id:uid(),lender:name,principal:0,start:d.date,repay:0,freq:'Monthly'};S.loans.push(l);}
    if(amt(d.repay)>0){l.repay=amt(d.repay);l.freq=d.freq;}
    if(!l.start||d.date<l.start)l.start=d.date;
    S.loanDraws.push({id:uid(),date:d.date,loanId:l.id,amount,note:(d.note||'').trim()});
    return isNew?'Loan added':`Added to ${l.lender} — now ${money(loanBal(l))} owed`;},
  async loanpay(d){const amount=amt(d.amount);if(amount<=0)return toast('Enter an amount');
    const l=S.loans.find(l=>l.id===d.loanId),bal=loanBal(l);
    if(amount>bal+0.004&&!await ask(`Only ${money(Math.max(0,bal))} is owed to ${l.lender}. Record ${money(amount)} anyway?`))return;
    S.loanPayments.push({id:uid(),date:d.date,loanId:d.loanId,amount});return 'Repayment recorded';}
};

async function submitForm(f){
  if(!f)return;
  f.querySelectorAll('.bad-field').forEach(el=>el.classList.remove('bad-field'));
  const missing=[...f.querySelectorAll('[required]')].find(el=>!String(el.value).trim());
  if(missing){missing.classList.add('bad-field');missing.focus();
    const lab=missing.closest('label');return toast('Please fill in '+(lab?lab.firstChild.textContent.trim():'all required fields'));}
  const d={};f.querySelectorAll('input[name],select[name]').forEach(el=>d[el.name]=el.value);
  let msg;try{msg=await handlers[f.dataset.form]?.(d);}catch(err){console.error(err);return toast('Something went wrong saving that. Please try again.');}
  if(!msg)return;save();render();toast(msg);
}

document.addEventListener('click',async e=>{
  const n=e.target.closest('nav button');if(n){go(n.dataset.tab,null);return;}
  if(e.target.matches&&e.target.matches('input[type=date]')){try{e.target.showPicker();}catch(err){}}

  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='period'){period=b.dataset.p;render();}
  else if(act==='cust'){go(tab==='contacts'?'contacts':'customers',b.dataset.id);}
  else if(act==='back'){if(history.state&&history.state.otl&&history.length>1&&backable)history.back();else go(tab,null);}
  else if(act==='del'){
    const coll=b.dataset.coll,id=b.dataset.id;
    if(coll==='loans'){const l=S.loans.find(l=>l.id===id);if(!await ask(`Delete the ${l.lender} loan and everything borrowed and repaid on it?`))return;S.loanPayments=S.loanPayments.filter(p=>p.loanId!==id);S.loanDraws=S.loanDraws.filter(p=>p.loanId!==id);}
    else if(!await ask('Delete this entry?','Delete'))return;
    S[coll]=S[coll].filter(x=>x.id!==id);save();render();toast('Deleted');
  }
  else if(act==='delcust'){
    const id=b.dataset.id,c=S.customers.find(c=>c.id===id);
    const has=S.sales.some(x=>x.customerId===id)||S.custPayments.some(x=>x.customerId===id)||S.purchases.some(x=>x.supplierId===id);
    if(!await ask(has?`${c.name} has sales, repayments or purchases recorded. Deleting removes their credit history; their sales stay in your totals as walk-in sales and purchases keep their name. Continue?`:`Delete ${c.name}?`,'Delete contact'))return;
    S.sales.forEach(x=>{if(x.customerId===id){x.customerId='';x.pay='cash';}});
    S.purchases.forEach(x=>{if(x.supplierId===id){x.supplier=c.name;x.supplierId='';}});
    S.custPayments=S.custPayments.filter(x=>x.customerId!==id);S.customers=S.customers.filter(x=>x.id!==id);
    openCust=null;save();render();toast('Contact deleted');
  }
  else if(act==='renameloan'){
    const l=S.loans.find(l=>l.id===b.dataset.id);if(!l)return;
    const name=await fieldDialog(`Rename ${l.lender}`,'Lender',{value:l.lender,okLabel:'Rename'});
    if(!name||!name.trim()||name.trim()===l.lender)return;
    const other=S.loans.find(o=>o!==l&&o.lender.trim().toLowerCase()===name.trim().toLowerCase());
    if(other){
      if(!await ask(`Join ${l.lender} into ${other.lender}? Everything borrowed and repaid moves across and becomes one balance.`,'Join them'))return;
      S.loanDraws.forEach(x=>{if(x.loanId===l.id)x.loanId=other.id;});S.loanPayments.forEach(x=>{if(x.loanId===l.id)x.loanId=other.id;});
      if(!+other.repay&&+l.repay){other.repay=l.repay;other.freq=l.freq;}
      S.loans=S.loans.filter(x=>x!==l);save();render();toast(`Joined — ${money(loanBal(other))} owed to ${other.lender}`);
    } else {l.lender=name.trim();save();render();toast('Renamed');}
  }
  else if(act==='edit')editEntry(b.dataset.coll,b.dataset.id);
  else if(act==='stmt')openStatements([b.dataset.id]);
  else if(act==='stmtall')openStatements(overdueAccounts().map(x=>x.c.id));
  else if(act==='stmtset')statementSettings();
  else if(act==='export')download(`one-tree-locale-backup-${today()}.json`,JSON.stringify(S,null,2),'application/json');
  else if(act==='import')$('#importFile').click();
  else if(act==='csv')exportCsv();
  else if(act==='csvin')$('#csvFile').click();
  else if(act==='reset'){if(await ask('Delete ALL data? This cannot be undone.','Delete everything')&&await ask('Are you really sure? Export a backup first if you haven’t.','Yes, delete it all')){S=blank();save();render();toast('All data deleted');}}
});

function download(name,text,type){
  try{const file=new File([text],name,{type});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:name}).catch(err=>{if(err&&err.name!=='AbortError')saveFile(name,text,type);});return;}}catch(e){}
  saveFile(name,text,type);
}
function saveFile(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

/* Import a CSV made by "Export transactions (CSV)" */
function parseCsv(t){
  const rows=[];let row=[],f='',q=false;t=String(t).replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}
function csvDate(v){
  v=String(v||'').trim();let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/); // Australian day/month/year, e.g. after opening in Excel
  if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
  return '';
}
function fieldDialog(m,label,{value='',decimal=false,okLabel='Save',cancelLabel='Cancel'}={}){return new Promise(res=>{
  const o=document.createElement('div');o.className='modal';

    <div class="row" style="display:grid;gap:10px;margin-bottom:16px"><label><span></span><input data-f="v" type="text" autocomplete="off"></label></div>
    <div class="actions"><button type="button" class="btn ghost" data-a="0"></button><button type="button" class="btn" data-a="1"></button></div></div>`;
  o.querySelector('p').textContent=m;o.querySelector('label span').textContent=label;
  o.querySelector('[data-a="0"]').textContent=cancelLabel;o.querySelector('[data-a="1"]').textContent=okLabel;
  const el=o.querySelector('[data-f=v]');el.value=value;if(decimal)el.inputMode='decimal';
  const done=v=>{o.remove();res(v);};
  o.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)done(b.dataset.a==='1'?el.value:null);});
  o.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();done(el.value);}if(e.key==='Escape')done(null);});
  document.body.appendChild(o);el.focus();el.select();
});}

async function importCsv(text){
  const rows=parseCsv(text);
  const head=(rows[0]||[]).map(h=>h.trim().toLowerCase()),col=n=>head.indexOf(n);
  const C={date:col('date'),type:col('type'),party:col('party'),desc:col('description'),cat:col('category'),amount:col('amount'),credit:col('on credit')};
  if(C.date<0||C.type<0||C.amount<0){toast('That CSV isn’t one exported from this app');return;}
  const get=(r,k)=>C[k]<0?'':String(r[C[k]]??'').trim();
  const nameKey=n=>String(n||'').trim().toLowerCase();
  // Fingerprints of what's already here, so importing the same file twice doesn't double up
  const fp=(type,date,party,desc,a)=>[type,date,nameKey(party),nameKey(desc),Math.abs(+a).toFixed(2)].join('|');
  const lname=id=>(S.loans.find(l=>l.id===id)||{}).lender||'';
  const have=new Set([
    ...S.sales.map(x=>fp('sale',x.date,x.customerId?custName(x.customerId):'',x.desc,x.amount)),
    ...S.purchases.map(x=>fp('purchase',x.date,supplierName(x),x.desc,x.amount)),
    ...S.custPayments.map(x=>fp('customer repayment',x.date,custName(x.customerId),x.note,x.amount)),
    ...S.loanDraws.map(x=>fp('loan borrowed',x.date,lname(x.loanId),x.note,x.amount)),
    ...S.loanPayments.map(x=>fp('loan repayment',x.date,lname(x.loanId),'',x.amount))]);
  const add={sales:[],purchases:[],custPayments:[],loanPayments:[],loanDraws:[]},newContacts=[],newLoans=[];let dup=0,bad=0;
  const contactId=name=>{const k=nameKey(name);if(!k||k==='walk-in'||k==='(deleted contact)')return '';
    let c=S.customers.find(c=>nameKey(c.name)===k)||newContacts.find(c=>nameKey(c.name)===k);
    if(!c){c={id:uid(),name:name.trim(),phone:'',email:'',notes:'',limit:0};newContacts.push(c);}return c.id;};
  const loanFor=name=>{const k=nameKey(name)||'loan';
    let l=S.loans.find(l=>nameKey(l.lender)===k)||newLoans.find(l=>nameKey(l.lender)===k);
    if(!l){l={id:uid(),lender:name.trim()||'Loan',principal:0,start:'',repay:0,freq:'Monthly'};newLoans.push(l);}return l;};
  for(const r of rows.slice(1)){
    const type=get(r,'type').toLowerCase(),date=csvDate(get(r,'date')),party=get(r,'party'),desc=get(r,'desc'),a=Math.abs(amt(get(r,'amount')));
    if(!date||!a||!['sale','purchase','customer repayment','loan repayment','loan borrowed'].includes(type)){bad++;continue;}
    const key=fp(type,date,party==='Walk-in'?'':party,type==='loan repayment'?'':desc,a);
    if(have.has(key)){dup++;continue;}have.add(key);
    if(type==='sale')add.sales.push({id:uid(),date,customerId:contactId(party),desc,amount:a,pay:/^y/i.test(get(r,'credit'))?'credit':'cash'});
    else if(type==='purchase'){const sid=contactId(party);add.purchases.push({id:uid(),date,supplierId:sid,supplier:sid?'':party,desc,cat:get(r,'cat')||'Other',amount:a});}
    else if(type==='customer repayment'){const cid=contactId(party);if(!cid){bad++;continue;}add.custPayments.push({id:uid(),date,customerId:cid,amount:a,note:desc});}
    else if(type==='loan borrowed'){const l=loanFor(party);if(!l.start||date<l.start)l.start=date;add.loanDraws.push({id:uid(),date,loanId:l.id,amount:a,note:desc});}
    else{const l=loanFor(party);if(!l.start||date<l.start)l.start=date;add.loanPayments.push({id:uid(),date,loanId:l.id,amount:a});}
  }
  const n=add.sales.length+add.purchases.length+add.custPayments.length+add.loanPayments.length+add.loanDraws.length;
  if(!n){toast(dup?'Everything in that CSV is already in the app':'No transactions found in that CSV');return;}
  const parts=[`${add.sales.length} sales`,`${add.purchases.length} purchases`,`${add.custPayments.length} customer repayments`,`${add.loanPayments.length} loan repayments`];if(add.loanDraws.length)parts.push(`${add.loanDraws.length} loan borrowings`);
  let msg=`Add ${n} transactions from this CSV (${parts.join(', ')})?`;
  if(newContacts.length)msg+=` ${newContacts.length} new contact${newContacts.length>1?'s':''} will be created.`;
  if(dup)msg+=` ${dup} already in the app will be skipped.`;
  if(bad)msg+=` ${bad} row${bad>1?'s':''} couldn’t be read and will be skipped.`;
  if(!await ask(msg,'Import'))return;
  // Older CSVs only have the repayments, not how much was borrowed, so ask for any new lender without borrowing rows
  for(const l of newLoans){
    if(add.loanDraws.some(x=>x.loanId===l.id))continue;
    const paid=sum(add.loanPayments.filter(p=>p.loanId===l.id),'amount');
    const v=await amountDialog(`The CSV has ${money(paid)} repaid to ${l.lender}, but not how much was borrowed. Enter the amount borrowed so the balance is right (Skip to use ${money(paid)}).`);
    add.loanDraws.push({id:uid(),date:l.start||today(),loanId:l.id,amount:v||paid,note:'Opening amount'});
  }
  S.customers.push(...newContacts);S.loans.push(...newLoans);
  for(const k in add)S[k].push(...add[k]);
  save();render();toast(`Imported ${n} transactions`);
}

/* ---------- Statements of account ---------- */
const fmtLong=d=>new Date(d+'T00:00:00Z').toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
function statementHtml(id){
  const c=S.customers.find(c=>c.id===id);if(!c)return '';
  const a=aging(id),st=sett(),d=today(),biz=st.bizName||'One Tree Locale';
  const since=addDays(d,-90);
  const pays=S.custPayments.filter(p=>p.customerId===id&&p.date>=since&&p.date<=d).sort(byDateDesc);
  const bizLines=[st.abn?'ABN '+st.abn:'',st.address,[st.phone,st.email].filter(Boolean).join(' · ')].filter(Boolean).map(esc).join('<br>');
  const toLines=[c.phone,c.email].filter(Boolean).map(esc).join('<br>');
  const due0=a.buckets[0];
  const alert=a.overdue>0.004
    ?`<div class="stmt-alert">Your account is overdue. ${money(a.overdue)} is past its due date — the oldest by ${daysTxt(a.oldest)}. Please pay the overdue amount as soon as possible.</div>`
    :a.balance>0.004?`<div class="stmt-alert ok">Thank you — nothing on your account is overdue.</div>`
    :`<div class="stmt-alert ok">Your account is fully paid. Thank you!</div>`;
  const status=i=>i.over>0?`<span class="late">${daysTxt(i.over)} overdue</span>`:i.over===0?'<span class="late">Due today</span>':`<span class="soon">Due in ${daysTxt(-i.over)}</span>`;
  const items=a.items.map(i=>`<tr><td>${fmtDate(i.date)}</td><td>${esc(i.desc)||'Sale'}</td><td class="num hide-sm">${money(+i.amount)}</td><td class="num">${money(i.owing)}</td><td class="hide-sm">${fmtDate(i.due)}</td><td>${status(i)}</td></tr>`).join('');
  const B=['Not yet due','1–30 days','31–60 days','61–90 days','90+ days'];
  return `<article class="stmt">
  <div class="stmt-top">
    <div class="stmt-biz"><img src="icons/icon-192.png" alt=""><div><b>${esc(biz)}</b><small>${bizLines}</small></div></div>
    <div class="stmt-title"><b>Statement of account</b><span>${fmtLong(d)}</span></div>
  </div>
  <div class="stmt-body">
    <div class="stmt-meta">
      <div><div class="lab">Statement for</div><div class="to">${esc(c.name)}</div><div>${toLines}</div></div>
      <div style="text-align:right"><div class="lab">Payment terms</div><div>${a.terms?`${daysTxt(a.terms)} from date of sale`:'Due on the day of sale'}</div></div>
    </div>
    ${alert}
    <div class="stmt-sum">
      <div class="${a.overdue>0.004?'hot':''}"><span>Overdue now</span><b>${money(a.overdue)}</b></div>
      <div><span>Not yet due</span><b>${money(due0)}</b></div>
      <div><span>Total owing</span><b>${money(Math.max(0,a.balance))}</b></div>
    </div>
    ${a.items.length?`<h3>Unpaid sales</h3>
    <table><thead><tr><th>Date</th><th>Description</th><th class="num hide-sm">Amount</th><th class="num">Still owing</th><th class="hide-sm">Due</th><th>Status</th></tr></thead>
    <tbody>${items}</tbody><tfoot><tr><td></td><td>Total owing</td><td class="hide-sm"></td><td class="num">${money(a.items.reduce((t,i)=>t+i.owing,0))}</td><td class="hide-sm"></td><td></td></tr></tfoot></table>
    <h3>How old the balance is</h3>
    <table class="stmt-aging"><thead><tr>${B.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody><tr>${a.buckets.map((v,k)=>`<td class="num${k&&v>0.004?' hot':''}">${money(v)}</td>`).join('')}</tr></tbody></table>`:''}
    ${a.credit>0.004?`<p>You have ${money(a.credit)} in credit on your account. Thank you!</p>`:''}
    <h3>Payments received in the last 90 days</h3>
    ${pays.length?`<table><thead><tr><th>Date</th><th>Note</th><th class="num">Amount</th></tr></thead><tbody>${pays.map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.note)}</td><td class="num">${money(+p.amount)}</td></tr>`).join('')}</tbody></table>`:'<p style="margin:4px 0">No payments received in the last 90 days.</p>'}
    ${st.payDetails?`<h3>How to pay</h3><div class="stmt-pay">${esc(st.payDetails)}${a.overdue>0.004?`\nPlease use “${esc(c.name)}” as the reference.`:''}</div>`:''}
    <p class="stmt-foot">${esc(st.footer||'If you’ve paid recently, thank you, and please disregard this statement. Any questions, just get in touch.')}</p>
  </div></article>`;
}
function statementText(id){
  const c=S.customers.find(c=>c.id===id),a=aging(id),st=sett(),biz=st.bizName||'One Tree Locale';
  const L=[`Hi ${c.name},`,'',`Here is your statement from ${biz} as at ${fmtDate(today())}.`,''];
  if(a.overdue>0.004)L.push(`Overdue now: ${money(a.overdue)} (oldest ${daysTxt(a.oldest)} past due)`);
  L.push(`Total owing: ${money(Math.max(0,a.balance))}`);
  if(a.items.length){L.push('','Unpaid sales:');a.items.forEach(i=>L.push(`• ${fmtDate(i.date)} ${i.desc||'Sale'} — ${money(i.owing)} ${i.over>0?`(${daysTxt(i.over)} overdue)`:`(due ${fmtDate(i.due)})`}`));}
  if(st.payDetails)L.push('','How to pay:',st.payDetails);
  L.push('',st.footer||'If you’ve paid recently, thank you, and please disregard this. Any questions, just get in touch.','',`Thanks,`,biz);
  return L.join('\n');
}
function openStatements(ids){
  ids=ids.filter(id=>S.customers.some(c=>c.id===id));if(!ids.length)return toast('No statements to create');
  document.querySelectorAll('.stmt-wrap').forEach(m=>m.remove());
  const one=ids.length===1,c=one&&S.customers.find(c=>c.id===ids[0]);
  const o=document.createElement('div');o.className='modal stmt-wrap';o.id='stmt';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  o.innerHTML=`<div class="stmt-bar">
    <button type="button" class="btn sm" data-s="print">${one?'Print / PDF':`Print all ${ids.length} / PDF`}</button>
    ${one?`<button type="button" class="btn sm" data-s="share">Share</button>`:''}
    ${one&&c.email?`<button type="button" class="btn sm" data-s="email">Email</button>`:''}
    ${one&&c.phone?`<button type="button" class="btn sm" data-s="sms">Text</button>`:''}
    <button type="button" class="btn sm close" data-s="close">Close</button></div>
    <div class="stmt-pages">${ids.map(statementHtml).join('')}</div>`;
  const oldTitle=document.title;
  // The PDF file name comes from the page title
  document.title=one?`Statement - ${c.name} - ${today()}`:`Overdue statements - ${today()}`;
  let pushed=false;try{history.pushState({otl:1,tab,openCust,stmt:1},'');pushed=true;}catch(e){}
  const close=()=>{document.title=oldTitle;document.removeEventListener('keydown',key,true);
    if(pushed&&history.state&&history.state.stmt)history.back();else o.remove();};
  const key=e=>{if(e.key==='Escape'&&document.contains(o)){e.stopPropagation();close();}};
  const text=()=>statementText(ids[0]);
  o.addEventListener('click',async e=>{const b=e.target.closest('[data-s]');if(!b)return;const s=b.dataset.s;
    if(s==='close')close();
    else if(s==='print')window.print();
    else if(s==='share'){const t=text();
      if(navigator.share){navigator.share({title:`Statement for ${c.name}`,text:t}).catch(()=>{});}
      else{try{await navigator.clipboard.writeText(t);toast('Statement copied — paste it into a message');}catch(err){toast('Couldn’t share from this browser');}}}
    else if(s==='email')location.href=`mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(`Statement of account – ${sett().bizName||'One Tree Locale'}`)}&body=${encodeURIComponent(text())}`;
    else if(s==='sms')location.href=`sms:${encodeURIComponent(c.phone.replace(/[^0-9+]/g,''))}?body=${encodeURIComponent(text())}`;
  });
  // If the back button closes it, put the title back
  const obs=new MutationObserver(()=>{if(!document.contains(o)){document.title=oldTitle;document.removeEventListener('keydown',key,true);obs.disconnect();}});
  obs.observe(document.body,{childList:true});
  document.addEventListener('keydown',key,true);document.body.appendChild(o);o.scrollTop=0;
}
function statementSettings(){
  const st=sett();
  const o=document.createElement('div');o.className='modal';
  const f=(k,label,ph='',extra='')=>`<label>${label}<input data-f="${k}" value="${esc(st[k]||'')}" placeholder="${esc(ph)}" ${extra}></label>`;
  o.innerHTML=`<div class="modal-box wide" role="dialog" aria-modal="true"><h2>Payment terms &amp; statement details</h2>
    <div style="display:grid;gap:10px;margin-bottom:16px">
      <label>Usual payment terms (days)<input data-f="terms" inputmode="numeric" value="${defaultTerms()}"></label>
      <p class="note" style="margin:-4px 0 4px">How long customers have to pay for a credit sale before it counts as overdue. You can set different terms for one customer on their contact page.</p>
      ${f('bizName','Business name','One Tree Locale')}
      ${f('abn','ABN','Optional','inputmode="numeric"')}
      ${f('address','Address','Optional')}
      ${f('phone','Phone','Optional','type="tel"')}
      ${f('email','Email','Optional','type="email"')}
      <label>How to pay<textarea data-f="payDetails" rows="4" placeholder="e.g. Bank transfer to One Tree Locale&#10;BSB 000-000  Account 00000000">${esc(st.payDetails||'')}</textarea></label>
      <label>Note at the bottom<textarea data-f="footer" rows="2" placeholder="If you’ve paid recently, thank you, and please disregard this statement. Any questions, just get in touch.">${esc(st.footer||'')}</textarea></label>
    </div>
    <div class="actions"><button type="button" class="btn ghost" data-a="0">Cancel</button><button type="button" class="btn" data-a="1">Save</button></div></div>`;
  const v=k=>o.querySelector(`[data-f="${k}"]`).value.trim();
  const close=()=>{o.remove();document.removeEventListener('keydown',key,true);};
  const key=e=>{if(e.key==='Escape'){e.stopPropagation();close();}};
  o.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a!=='1')return close();
    const t=v('terms').replace(/[^0-9]/g,'');
    S.settings=Object.assign(sett(),{terms:t===''?30:+t,bizName:v('bizName'),abn:v('abn'),address:v('address'),phone:v('phone'),email:v('email'),payDetails:v('payDetails'),footer:v('footer')});
    save();close();render();toast('Saved');});
  document.addEventListener('keydown',key,true);document.body.appendChild(o);o.querySelector('[data-f=terms]').focus();
}

/* Phone back button: step back through screens the person visited; from the first screen, back closes the app */
let backable=false;
function go(t,c){
  if(t===tab&&c===openCust){window.scrollTo(0,0);return;}
  tab=t;openCust=c;
  try{history.pushState({otl:1,tab,openCust},'');backable=true;}catch(e){}
  render();window.scrollTo(0,0);
}
window.addEventListener('popstate',e=>{
  document.querySelectorAll('.modal').forEach(m=>m.remove());
  const st=e.state&&e.state.otl?e.state:{tab:'dash',openCust:null};
  tab=st.tab||'dash';openCust=st.openCust||null;render();window.scrollTo(0,0);
});
// Coming back to a page the phone had paused: redraw so it's never blank
window.addEventListener('pageshow',e=>{if(e.persisted||!document.querySelector('main').children.length)render();});
try{history.replaceState({otl:1,tab,openCust},'');}catch(e){}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}
</script>
